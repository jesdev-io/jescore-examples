; +++ Stereo SPL Meter +++
[env:stereo_spl_meter_nucleol432kc-cube]
extends = _env:nucleol432kc-cube
lib_ignore = 
        ${_env_base.lib_ignore}
        !lib/port_stereo_spl_meter_stm32
        !lib/utils
build_src_filter = +<stereo_spl_meter_nucleol432kc.c>
; --- Stereo SPL Meter ---

; +++ TinyUSB Audio Loopback +++
[env:tinyusb_audio_loopback_nucleo_h753zi-cube]
extends = _env:nucleo_h753zi-cube
platform_packages =
    platformio/toolchain-gccarmnoneeabi@1.140201.0
lib_deps =
    ${_env_base.lib_deps}
    https://github.com/hathach/tinyusb.git#0.21.0
lib_ignore =
        ${_env_base.lib_ignore}
        !lib/tinyusb_audio_h753zi
build_flags =
    ${_env:nucleo_h753zi-cube.build_flags}
    -DCFG_TUSB_MCU=OPT_MCU_STM32H7
    -DBOARD_TUD_RHPORT=0
    -DBOARD_TUD_MAX_SPEED=OPT_MODE_FULL_SPEED
    -DCFG_TUSB_DEBUG=0
    -Ilib/tinyusb_audio_h753zi
    -I$PROJECT_PACKAGES_DIR/framework-stm32cubeh7/Middlewares/Third_Party/FreeRTOS/Source/include
    -I$PROJECT_PACKAGES_DIR/framework-stm32cubeh7/Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM7/r0p1
    -I.pio/libdeps/$PIOENV/jescore/include/FreeRTOSConfig
    -I.pio/libdeps/$PIOENV/jescore/include
    -Wno-error=implicit-function-declaration
build_src_filter = +<tinyusb_audio_loopback_h753zi.c>
upload_protocol = custom
upload_command = $PROJECT_PACKAGES_DIR/tool-openocd/bin/openocd -s $PROJECT_PACKAGES_DIR/tool-openocd/openocd/scripts -f interface/stlink.cfg -c "adapter serial 004300483033511935393935" -c "transport select swd" -f target/stm32h7x.cfg -c "program {$BUILD_DIR/firmware.elf} verify reset; shutdown;"
; --- TinyUSB Audio Loopback ---

; +++ Hardware Virtualization +++
[env:hwv_esp32-c3-arduino]
extends = _env:esp32-c3-arduino
build_src_filter = +<hwv_arduino.cpp>
; --- Hardware Virtualization ---

