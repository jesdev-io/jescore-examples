
; ++++++++++ BASE ENV ++++++++++
[_env_base]
upload_speed = 921600
monitor_speed = 115200
build_src_filter = -<*>
lib_deps =
    jescore
lib_ignore = lib/*
; ---------- BASE ENV ---------- 

; ++++++++++ ESP32 BOARDS ++++++++++
[_env:esp32]
extends = _env_base
platform = espressif32
platform_packages = tool-esptoolpy@~1.40501.0

[_env:esp32-arduino]
extends = _env:esp32
framework = arduino
test_filter = test_arduino

[_env:esp32-az-delivery-devkit-v4-arduino]
extends = _env:esp32-arduino
board = az-delivery-devkit-v4
upload_protocol = esptool
build_flags =
    -DLED_BUILTIN=5

[_env:esp32-c3-arduino]
extends = _env:esp32-arduino
board = esp32-c3-devkitm-1

[_env:esp32-s3-arduino]
extends = _env:esp32-arduino
board = esp32-s3-devkitc-1

[_env:esp32-wrover-kit-arduino]
extends = _env:esp32-arduino
board = esp-wrover-kit
build_flags = 
    -DLED_BUILTIN=5

[_env:esp32-nodemcu-arduino]
extends = _env:esp32-arduino
board = nodemcu-32s
; ---------- ESP32 BOARDS ---------- 

; ++++++++++ STM32 BOARDS ++++++++++
[_env:stm32]
extends = _env_base
platform = ststm32
test_transport = custom
test_filter = test_stm32cube
lib_archive = no

[_env:stm32-cube]
extends = _env:stm32
framework = stm32cube
build_flags = 
    -mfloat-abi=hard
    -mfpu=fpv4-sp-d16

[_env:nucleol432kc-cube]
extends = _env:stm32-cube
board = nucleo_l432kc
upload_protocol = stlink 

[_env:nucleol476rg-cube]
extends = _env:stm32-cube
board = nucleo_l476rg
upload_protocol = stlink

[_env:nucleo_g431kb-cube]
extends = _env:stm32-cube
board = nucleo_g431kb
upload_protocol = stlink

[_env:nucleo_h753zi-cube]
extends = _env:stm32-cube
board = nucleo_h753zi
upload_protocol = stlink
build_flags = 
    ${_env:stm32-cube.build_flags}
    -mfpu=fpv5-d16
    -mfloat-abi=hard 
; ---------- STM32 BOARDS ---------- 

; ++++++++++ EXAMPLES ++++++++++
